[package]
name = "canto"
version = "0.1.0"
edition = "2024"
authors = ["thunderfury-org"]
description = "A lightweight transparent proxy and configuration orchestrator for sing-box"
license = "MIT"

[dependencies]
# Async runtime & signals
tokio = { version = "1", features = ["full"] }

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Error handling
thiserror = "2.0"

# Filesystem & directories
dirs = "6.0"
