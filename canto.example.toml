[canto]
work_dir = "./run"
log_level = "info"

[singbox]
binary = "sing-box"
source = ".data/config-with-tailscale.json"
config_path = "./run/config.json"
api_listen = "127.0.0.1:9090"

[network]
enabled = true
mode = "tproxy"
tproxy_port = 7893
dns_port = 1053
mixed_port = 7890
fwmark = 424081
routing_mark = 424080
tun_interface = "tun0"
bypass_cn_ips = true
bypass_reserved_ips = true
# empty = auto-detect on Linux, RFC1918 fallback otherwise
lan_cidrs = []
