[canto]
work_dir = "./run"

[singbox]
binary = "sing-box"
source = ".data/config-with-tailscale.json"
# source = "https://config.example/source.json"
config_path = "./run/config.json"
refresh_interval_secs = 86400

[network]
enabled = true
lan = true
local = true
docker = false
tcp = true
udp = false
ports = "common"
bypass_cn = true
mixed_port = 7890
tproxy_port = 7893
dns_port = 1053
# empty = auto-detect LAN interfaces on Linux
lan_cidrs = []
# fwmark = 424081
# routing_mark = 424080
# bypass_cn 时读 work_dir/cn_ip.txt；没有则下载 china_ip_list.txt
