[canto]
work_dir = "./run"

[singbox]
binary = "sing-box"
source = ".data/config-with-tailscale.json"
# source = "https://config.example/source.json"
config_path = "./run/config.json"
refresh_interval_secs = 86400

[network]
enabled = true
lan = true
local = true
docker = false
tcp = true
udp = false
ports = "common"
bypass_cn = true
mixed_port = 7890
# empty = auto-detect LAN interfaces on Linux
lan_cidrs = []
# mode = "tproxy"          # TUN 默认；tproxy 是逃生口
# tproxy_port = 7893       # 仅 tproxy
# dns_port = 1053          # 仅 tproxy
# fwmark = 424081          # 仅 tproxy
# routing_mark = 424080    # 仅 tproxy
