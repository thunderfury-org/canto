[canto]
work_dir = "./run"

[singbox]
binary = "sing-box"
source = ".data/config-with-tailscale.json"
# source = "https://config.example/source.json"
config_path = "./run/config.json"
refresh_interval_secs = 86400

[network]
enabled = true
tproxy_port = 7893
dns_port = 1053
mixed_port = 7890
fwmark = 424081
routing_mark = 424080
# empty = auto-detect on Linux, RFC1918 fallback otherwise
lan_cidrs = []
